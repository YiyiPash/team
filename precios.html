<style>
/* Precios (sesión 3, 22/11): consultar rápido el precio de cualquier pieza o servicio, sin abrir la nota. Color del módulo Ventas. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --bad:#c0262d;
  --c:#dd6a3a; --c2:#ffe0cf; --c3:#fff4ec;
  --font:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.logo{height:42px;width:auto;display:block}
h1{font-weight:700;font-size:23px;line-height:1.2;color:#b82a6c;margin:0;letter-spacing:-.2px}
.mu{font-size:13px;color:var(--mu);margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #f3b4b8;border-radius:12px;padding:10px 12px}
.buscar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;display:grid;gap:8px;background:var(--bg);padding:4px 0 6px}
#q{width:100%;font:500 16px var(--font);padding:12px 14px;border:1.5px solid var(--c2);border-radius:14px;background:#fff;color:var(--fg)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c2);color:#8a3712;font-weight:700}
.lista{display:grid;gap:8px}
.it{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--c2);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.it:focus-visible,.chip:focus-visible,#q:focus-visible,.cerrar:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.mini{flex:none;width:46px;height:46px;border-radius:12px;background:var(--c3);border:1.5px solid var(--c2);display:grid;place-items:center;overflow:hidden;color:var(--c);font-weight:700;font-size:13px}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.n{flex:1;min-width:0}
.n b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.n small{display:block;font-size:12.5px;color:var(--mu)}
.p{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.p b{display:block;font-size:19px;color:#8a3712}
.p small{display:block;font-size:12px;color:var(--mu)}
.grupo{font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--c);margin:6px 2px 0}
.vacio{background:var(--surface);border:1.5px dashed var(--c2);border-radius:16px;padding:18px;text-align:center;color:var(--mu)}
.ficha{position:fixed;inset:0;z-index:70;background:rgba(59,31,46,.45);display:flex;align-items:flex-end;justify-content:center}
.ficha .in{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-height:88vh;overflow:auto}
.ficha .foto{width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--c3);display:grid;place-items:center;overflow:hidden;color:var(--mu);font-size:13px}
.ficha .foto img{width:100%;height:100%;object-fit:contain;display:block}
.ficha h2{margin:0;font-size:20px;color:#8a3712}
.dato{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--c2);padding:8px 0;font-size:14px}
.dato span:first-child{color:var(--mu)}
.dato b{font-variant-numeric:tabular-nums;text-align:right}
.cerrar{border:none;border-radius:999px;padding:12px;font:700 15px var(--font);background:var(--c2);color:#8a3712;cursor:pointer}
.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
#cargador{position:fixed;inset:0;z-index:50;background:rgba(255,225,238,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--accent);text-align:center;padding:24px}
</style>
</head>

  <a class="yp-casita" href="./">⌂ Inicio</a>
  <h1>Precios</h1>
  <p class="mu">Busca por nombre o código. Toca un renglón para ver su foto y sus datos.</p>
  <p class="err" id="err" hidden></p>
  <div class="buscar">
    <input id="q" type="search" placeholder="Buscar: shinny, huggie, PAQ-005…" autocomplete="off" aria-label="Buscar producto o servicio">
    <div class="filtros" id="filtros" role="group" aria-label="Qué mostrar">
      <button class="chip" type="button" data-f="todo" aria-pressed="true">Todo</button>
      <button class="chip" type="button" data-f="P" aria-pressed="false">Piezas y productos</button>
      <button class="chip" type="button" data-f="S" aria-pressed="false">Servicios</button>
      <button class="chip" type="button" data-f="B" aria-pressed="false">Bazar</button>
    </div>
  </div>
  <div class="lista" id="lista" aria-live="polite"></div>
  <p class="mu" id="pie"></p>
</div>
<div class="ficha" id="ficha" hidden role="dialog" aria-modal="true" aria-labelledby="fTit"><div class="in" id="fichaIn"></div></div>
<div id="cargador" role="status" aria-live="polite"><div class="giro" aria-hidden="true"></div><p id="cargador-txt">Cargando precios…</p></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwJhAO5anQhZ_tzZ7f6jSE133AxFzSLU2rXkVH1vdtH9SlkMlbnvdjbez3786HIEhAf/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const guardar=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pesos=n=>'$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2});
async function api(action,data){
  const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
  const j=await res.json();
  if(!j.ok)throw new Error(j.error||'Error del servidor');
  return j.data;
}
function error(m){$('err').textContent=m?(/Failed to fetch|NetworkError|Load failed/i.test(m)?'No hay conexión. Revisa el internet e intenta otra vez.':m):'';$('err').hidden=!m;}
let D=null,filtro='todo',minis={};
try{const c=JSON.parse(leer('yp_cache_precios')||'null');if(c&&c.productos){D=c;}}catch(e){}   // sale al momento con lo de la última vez (sin datos de clientas)
try{minis=JSON.parse(sessionStorage.getItem('yp_cat_minis')||'{}');}catch(e){}

function todos(){
  if(!D)return [];
  const bz=(D.rapidos||[]).map(x=>({tipo:'B',codigo:x.id,nombre:x.nombre||'Sin nombre',precio:x.precio,foto:x.foto,cat:'BZR',categoria:'Bazar · precio rápido',descripcion:x.notas,activo:true}));
  return D.productos.filter(p=>p.activo).concat(D.servicios.filter(s=>s.activo),bz);
}
function pintar(){
  const q=norm($('q').value.trim());
  let L=todos().filter(i=>filtro==='todo'||i.tipo===filtro);
  if(q)L=L.filter(i=>norm(i.nombre+' '+i.codigo+' '+i.categoria+' '+(i.descripcion||'')+' '+(i.material||'')).includes(q));
  const ORD={P:0,S:1,B:2};
  L.sort((a,b)=>a.tipo===b.tipo?(a.categoria||'').localeCompare(b.categoria||'')||a.nombre.localeCompare(b.nombre,'es',{numeric:true}):ORD[a.tipo]-ORD[b.tipo]);
  let html='',g=null;
  L.forEach(i=>{
    const grupo=i.tipo==='S'?'Servicios · '+(i.categoria||i.cat):i.tipo==='B'?'Bazar · precios rápidos (en la nota van como ítem libre)':(i.categoria||i.cat);
    if(grupo!==g&&!q){g=grupo;html+=`<div class="grupo">${esc(grupo)}</div>`;}
    const m=i.foto&&minis[i.foto];
    html+=`<button class="it" type="button" data-c="${esc(i.codigo)}">
      <span class="mini">${m?`<img alt="" src="${m}">`:i.tipo==='B'?'📸':esc(i.cat||i.codigo.slice(0,3))}</span>
      <span class="n"><b>${esc(i.nombre)}</b><small>${esc(i.codigo)}${i.material?' · '+esc(i.material):''}</small></span>
      <span class="p"><b>${pesos(i.precio)}</b>${i.con_servicio?`<small>con perforación ${pesos(i.con_servicio)}</small>`:''}</span></button>`;
  });
  $('lista').innerHTML=html||`<div class="vacio">${q?'No encontré "'+esc($('q').value.trim())+'". Si no está en el catálogo, en la nota va como ítem libre.':'Sin precios todavía.'}</div>`;
  $('pie').textContent=D?L.length+' de '+todos().length:'';
  pedirMinis(L);
}
let pidiendo=false;
async function pedirMinis(L){
  const ids=L.map(i=>i.foto).filter(f=>f&&!(f in minis)).slice(0,30);
  if(!ids.length||pidiendo)return;
  pidiendo=true;
  try{const r=await api('consent_cat_mini',{ids});Object.assign(minis,r.minis);try{sessionStorage.setItem('yp_cat_minis',JSON.stringify(minis));}catch(e){}pintar();}
  catch(e){ids.forEach(i=>minis[i]='');}
  finally{pidiendo=false;}
}
function abrir(cod){
  const i=todos().find(x=>x.codigo===cod);if(!i)return;
  const fila=(t,v)=>v||v===0?`<div class="dato"><span>${t}</span><b>${esc(v)}</b></div>`:'';
  $('fichaIn').innerHTML=`<div class="foto" id="fFoto">${i.foto?'Cargando foto…':'Sin foto'}</div>
    <h2 id="fTit">${esc(i.nombre)}</h2>
    <p class="mu">${esc(i.codigo)} · ${esc(i.categoria||i.cat)}</p>
    ${fila('Precio',pesos(i.precio))}
    ${i.con_servicio?fila('Con perforación ('+(i.servicio_nombre||i.servicio)+')',pesos(i.con_servicio)):''}
    ${i.tipo==='S'&&i.anticipo!==''?fila('Anticipo',pesos(i.anticipo)):''}
    ${fila('Descripción',i.descripcion)}${fila('Material',i.material)}${fila('Talla',i.talla)}
    <button class="cerrar" type="button" id="fCerrar">Cerrar</button>`;
  $('ficha').hidden=false;$('fCerrar').focus();
  if(i.foto)api('consent_cat_foto_ver',{id:i.foto}).then(r=>{const f=$('fFoto');if(f)f.innerHTML=`<img alt="Foto de ${esc(i.nombre)}" src="${r.foto}">`;}).catch(()=>{const f=$('fFoto');if(f)f.textContent='No se pudo cargar la foto';});
}
function cerrar(){$('ficha').hidden=true;}
$('ficha').addEventListener('click',e=>{if(e.target.id==='ficha'||e.target.id==='fCerrar')cerrar();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});
$('lista').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)abrir(b.dataset.c);});
$('filtros').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filtro=b.dataset.f;[...$('filtros').children].forEach(x=>x.setAttribute('aria-pressed',x===b));pintar();});
$('q').addEventListener('input',pintar);
async function cargar(){
  error('');
  if(D){$('cargador').hidden=true;pintar();}
  try{
    const [c,b]=await Promise.all([api('consent_cat_lista',{}),api('consent_bz_lista',{}).catch(()=>({rapidos:[]}))]);
    D=Object.assign(c,{rapidos:b.rapidos||[]});
    guardar('yp_cache_precios',JSON.stringify({productos:D.productos,servicios:D.servicios,rapidos:D.rapidos}));
    pintar();
  }catch(x){error(x.message);}
  finally{$('cargador').hidden=true;}
}
if(window.YP_SESION)cargar();else document.addEventListener('yp-sesion',()=>cargar(),{once:true});
</script>
</body>
</html>
