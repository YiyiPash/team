<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pedidos · Yiyi Pash</title><link rel="icon" type="image/png" sizes="32x32" href="https://yiyipash.com/team/icono-32.png"><link rel="icon" type="image/png" sizes="192x192" href="https://yiyipash.com/team/icono-192.png"><link rel="apple-touch-icon" href="https://yiyipash.com/team/icono-180.png">
<meta name="robots" content="noindex">

<style>
/* Pedidos (sesión 3, 22/11): encargos de clientas con foto opcional, anticipo y su camino Pedido → Llegó → Avisado → Entregado. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --bad:#c0262d; --ok:#1f7a4d; --wa:#1f8a5b; --warn:#9a5b00; --warn2:#fff1d6;
  --c:#dd6a3a; --c2:#ffe0cf; --c3:#fff4ec;
  --font:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.logo{height:42px;width:auto;display:block}
h1{font-weight:700;font-size:23px;line-height:1.2;color:#b82a6c;margin:0;letter-spacing:-.2px}
h2{margin:0;font-size:19px;color:#8a3712}
.mu{font-size:13px;color:var(--mu);margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #f3b4b8;border-radius:12px;padding:10px 12px}
.ok{color:var(--ok);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #bfe3cf;border-radius:12px;padding:10px 12px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
input,select,textarea{width:100%;font:500 15px var(--font);padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
label.l{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--mu)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:12px 14px;font:700 15px var(--font);cursor:pointer;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--line)}
.btn.naranja{background:var(--c);color:#fff}
.btn.verde{background:var(--ok);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.oro{background:#f8eecd;color:#7a5a0c;border:1.5px solid #e9d48f}
.btn.baja{background:#fff;color:var(--bad);border:1.5px solid #f3b4b8}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn:focus-visible,.tab:focus-visible,.ped:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.link:focus-visible,.res:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.lista{display:grid;gap:8px}
.ped{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--c2);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.mini{flex:none;width:56px;height:56px;border-radius:12px;background:var(--c3);border:1.5px solid var(--c2);display:grid;place-items:center;overflow:hidden;font-size:22px}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.n{flex:1;min-width:0}.n b{display:block;font-size:15px}.n span{display:block;font-size:14px;overflow-wrap:anywhere}.n small{display:block;font-size:12.5px;color:var(--mu)}
.tarde{color:var(--bad);font-weight:700}
.pill{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.e-Pedido{background:var(--c2);color:#8a3712}.e-Llegó{background:#d8f2e6;color:#1f6b47}.e-Avisado{background:#ece3fb;color:#5b3a9a}.e-Entregado{background:#eee4e8;color:var(--mu)}.e-Cancelado{background:#fde2e2;color:#8f1d22}
.hoja{position:fixed;inset:0;z-index:70;background:rgba(59,31,46,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja .in{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.paso{text-align:center;font-size:11.5px;font-weight:700;border-radius:8px;padding:6px 2px;background:#f3eaee;color:var(--mu)}
.paso.ya{background:#d8f2e6;color:#1f6b47}.paso.hoy{background:var(--ok);color:#fff}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.foto{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:1.5px solid var(--c2);background:var(--c3);display:grid;place-items:center;font-size:12px;color:var(--mu);cursor:pointer;padding:0}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(59,31,46,.75);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.grande{width:100%;border-radius:14px;display:block}
.dato{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--c2);padding:7px 0;font-size:14px}
.dato span:first-child{color:var(--mu)}.dato b{text-align:right;overflow-wrap:anywhere}
.link{background:none;border:none;color:var(--accent);font:600 13px var(--font);padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
.conf{border:1.5px solid var(--c2);background:var(--c3);border-radius:14px;padding:12px;display:grid;gap:8px}
.cli{display:grid;gap:6px}
.res{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.res small{color:var(--mu)}
.elegida{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c3);border:1.5px solid var(--c2);border-radius:12px;padding:9px 11px;font-weight:600}
.vacio{background:var(--surface);border:1.5px dashed var(--c2);border-radius:16px;padding:18px;text-align:center;color:var(--mu)}
.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
#cargador{position:fixed;inset:0;z-index:90;background:rgba(255,225,238,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--accent);text-align:center;padding:24px}
@media (max-width:380px){.dos,.btns{grid-template-columns:1fr}}
</style>
</head>

  <a class="yp-casita" href="./">⌂ Inicio</a>
  <h1>Pedidos</h1>
  <p class="mu">Lo que una clienta encargó: qué es, su foto (si hay), el anticipo y en qué va. Se cobra en la nota, que resta el anticipo.</p>
  <p class="err" id="err" hidden></p>
  <p class="ok" id="okMsg" hidden></p>
  <div class="tabs" id="tabs" role="group" aria-label="Estado del pedido"></div>
  <button class="btn naranja" type="button" id="bNuevo">+ Nuevo pedido</button>
  <div class="lista" id="lista" aria-live="polite"></div>
</div>

<!-- Ver un pedido -->
<div class="hoja" id="hVer" hidden role="dialog" aria-modal="true" aria-labelledby="vTit"><div class="in" id="vIn"></div></div>

<!-- Nuevo / corregir -->
<div class="hoja" id="hForm" hidden role="dialog" aria-modal="true" aria-labelledby="fTit">
  <form class="in" id="form" novalidate>
    <h2 id="fTit">Nuevo pedido</h2>
    <div class="cli">
      <span class="mu" style="font-weight:700">Clienta</span>
      <div id="cliElegida" class="elegida" hidden><span id="cliTxt"></span><button class="link" type="button" id="cliQuitar">Cambiar</button></div>
      <div id="cliBuscar">
        <input id="cliQ" type="search" placeholder="Busca por nombre, apodo o ID" autocomplete="off" aria-label="Buscar clienta">
        <div id="cliRes" class="cli" style="margin-top:6px" aria-live="polite"></div>
        <button class="link" type="button" id="cliSinId">No está registrada: escribir su nombre</button>
      </div>
      <div id="cliManual" class="dos" hidden>
        <label class="l" for="fNombre">Nombre<input id="fNombre" maxlength="80" autocomplete="off"></label>
        <label class="l" for="fWa">WhatsApp (10 números)<input id="fWa" inputmode="tel" maxlength="14" autocomplete="off"></label>
      </div>
    </div>
    <label class="l" for="fDesc">¿Qué pidió?<textarea id="fDesc" maxlength="300" placeholder="Ej. Shinny igual a la de su perforación, dorada"></textarea></label>
    <label class="l" for="fSku">Del catálogo (opcional)<select id="fSku"><option value="">No está en el catálogo / no sé</option></select></label>
    <div class="dos">
      <label class="l" for="fPrecio">Precio acordado<input id="fPrecio" inputmode="decimal" placeholder="$" autocomplete="off"></label>
      <label class="l" for="fNota">Nota donde se pidió<input id="fNota" placeholder="D-0186 (opcional)" autocomplete="off"></label>
    </div>
    <div class="dos">
      <label class="l" for="fAnt">Anticipo (si dejó)<input id="fAnt" inputmode="decimal" placeholder="$0" autocomplete="off"></label>
      <label class="l" for="fForma">¿Cómo lo pagó?<select id="fForma"><option value="">—</option><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label>
    </div>
    <label class="l" for="fNotas">Notas<textarea id="fNotas" maxlength="500" placeholder="Talla, color, proveedor, cuándo llega…"></textarea></label>
    <div class="l" id="fFotoCaja"><span>Foto de referencia (opcional)</span><input id="fFoto" type="file" accept="image/*" aria-label="Foto de referencia"></div>
    <p class="err" id="fErr" hidden></p>
    <div class="btns"><button class="btn sec" type="button" id="fCancelar">Cancelar</button><button class="btn" type="submit">Guardar pedido</button></div>
  </form>
</div>
<div id="cargador" role="status" aria-live="polite"><div class="giro" aria-hidden="true"></div><p id="cargador-txt">Cargando pedidos…</p></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwJhAO5anQhZ_tzZ7f6jSE133AxFzSLU2rXkVH1vdtH9SlkMlbnvdjbez3786HIEhAf/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const pesos=n=>n===''||n===null||n===undefined?'—':'$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2});
const fechaTxt=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
async function api(action,data,texto){
  if(texto){$('cargador-txt').textContent=texto;$('cargador').hidden=false;}
  try{
    const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    return j.data;
  }finally{if(texto)$('cargador').hidden=true;}
}
const msg=m=>/Failed to fetch|NetworkError|Load failed/i.test(m)?'No hay conexión. Revisa el internet e intenta otra vez.':m;
function error(m){$('err').textContent=m?msg(m):'';$('err').hidden=!m;}
function okMsg(m){$('okMsg').textContent=m||'';$('okMsg').hidden=!m;}
let D=null,estado='Pedido',minis={},CAT=null,V=null,F=null;   // V = pedido abierto; F = formulario
try{minis=JSON.parse(sessionStorage.getItem('yp_cat_minis')||'{}');}catch(e){}
const ETQ={Pedido:'Por llegar',Llegó:'Ya llegaron',Avisado:'Avisados',Entregado:'Entregados',Cancelado:'Cancelados'};

function pintar(){
  const n=e=>D.pedidos.filter(p=>p.estado===e).length;
  $('tabs').innerHTML=D.estados.map(e=>`<button class="tab" type="button" data-e="${e}" aria-pressed="${e===estado}">${ETQ[e]} · ${n(e)}</button>`).join('');
  const L=D.pedidos.filter(p=>p.estado===estado);
  $('lista').innerHTML=L.map(p=>{const f=p.fotos[0],m=f&&minis[f];
    return `<button class="ped" type="button" data-id="${p.id}"><span class="mini">${m?`<img alt="" src="${m}">`:'📦'}</span>
      <span class="n"><b>${esc(p.nombre)}${p.id_clienta?' · '+esc(p.id_clienta):''}</b><span>${esc(p.descripcion)}</span>
      <small>${p.precio!==''?pesos(p.precio)+' · ':''}${p.anticipo?'anticipo '+pesos(p.anticipo)+' · ':'sin anticipo · '}<span style="white-space:nowrap">${esc(p.id)}</span> · desde ${fechaTxt(p.fecha)}${p.estado==='Pedido'&&p.dias>=14?` · <span class="tarde">${p.dias} días</span>`:''}</small></span>
      <span class="pill e-${p.estado}">${esc(p.estado)}</span></button>`;}).join('')||`<div class="vacio">${estado==='Pedido'?'Nada por llegar.':'Nada aquí.'}</div>`;
  pedirMinis(D.pedidos.flatMap(p=>p.fotos));
  contarInicio();
}
function contarInicio(){try{const g=JSON.parse(leer('yp_inicio_cuentas')||'{}');g.ped={n:D.pedidos.filter(p=>['Pedido','Llegó','Avisado'].includes(p.estado)).length,l:D.pedidos.filter(p=>p.estado==='Llegó').length};localStorage.setItem('yp_inicio_cuentas',JSON.stringify(g));}catch(e){}}
let pidiendo=false;
async function pedirMinis(ids){
  ids=ids.filter(f=>f&&!(f in minis)).slice(0,30);
  if(!ids.length||pidiendo)return;pidiendo=true;
  try{const r=await api('consent_cat_mini',{ids});Object.assign(minis,r.minis);try{sessionStorage.setItem('yp_cat_minis',JSON.stringify(minis));}catch(e){}pintar();if(V)abrir(V.id);}
  catch(e){ids.forEach(i=>minis[i]='');}finally{pidiendo=false;}
}

// ── Ver un pedido ──
function abrir(id){
  const p=D.pedidos.find(x=>x.id===id);if(!p)return;V=p;
  const orden=['Pedido','Llegó','Avisado','Entregado'],i=orden.indexOf(p.estado);
  const fila=(t,v)=>v||v===0?`<div class="dato"><span>${t}</span><b>${esc(v)}</b></div>`:'';
  const abierto=['Pedido','Llegó','Avisado'].includes(p.estado);
  $('vIn').innerHTML=`<h2 id="vTit">${esc(p.id)} · ${esc(p.nombre)}</h2>
    <p class="mu">${p.id_clienta?esc(p.id_clienta)+' · ':''}pidió el ${fechaTxt(p.fecha)}${p.lugar?' en '+esc(p.lugar):''}${p.registro_por?' · lo anotó '+esc(p.registro_por):''}</p>
    ${p.estado==='Cancelado'?'<p class="err">Cancelado</p>':`<div class="pasos">${orden.map((e,k)=>`<span class="paso${k<i?' ya':k===i?' hoy':''}">${e}</span>`).join('')}</div>`}
    <p style="margin:0;font-size:16px">${esc(p.descripcion)}</p>
    <div class="fotos" id="vFotos">${p.fotos.map(f=>`<span class="foto" data-ver="${f}">${minis[f]?`<img alt="Foto de referencia" src="${minis[f]}">`:'Foto'}${abierto?`<button class="x" type="button" data-quitar="${f}" aria-label="Quitar foto">×</button>`:''}</span>`).join('')}</div>
    ${abierto?'<div class="l"><input id="vFoto" type="file" accept="image/*" aria-label="Agregar foto de referencia"></div>':''}
    <div id="vGrande"></div>
    ${fila('Precio acordado',p.precio!==''?pesos(p.precio):'')}${fila('Del catálogo',p.sku)}
    ${fila('Anticipo',p.anticipo?pesos(p.anticipo)+' · '+p.forma_anticipo:'Sin anticipo')}
    ${fila('Nota donde se pidió',p.no_nota_pedido)}${fila('Nota donde se cobró',p.no_nota_cobro)}${fila('WhatsApp',p.whatsapp)}${fila('Notas',p.notas)}
    <div class="conf" id="vConf" hidden></div>
    <p class="err" id="vErr" hidden></p>
    ${abierto?`<div class="btns">${p.estado==='Pedido'?'<button class="btn verde" type="button" data-acc="llego">Ya llegó</button>':'<span></span>'}<button class="btn wa" type="button" data-acc="avisar">💬 Avisarle</button></div>
      <button class="btn oro" type="button" data-acc="cobrar">🧾 Cobrar en nota${p.anticipo?' (resta '+pesos(p.anticipo)+')':''}</button>
      <div class="btns"><button class="btn sec" type="button" data-acc="editar">Corregir</button><button class="btn baja" type="button" data-acc="cancelar">Cancelar pedido</button></div>
      <button class="link" type="button" data-acc="entregado">Ya se entregó (con otra nota o sin nota)</button>`
     :`<button class="link" type="button" data-acc="reabrir">Regresarlo a "${p.estado==='Cancelado'?'Pedido':'Avisado'}" (si se marcó por error)</button>`}
    <button class="btn sec" type="button" data-acc="cerrar">Cerrar</button>`;
  $('hVer').hidden=false;
}
function vError(m){const e=$('vErr');if(e){e.textContent=m?msg(m):'';e.hidden=!m;}}
function vConf(html,si){const c=$('vConf');c.innerHTML=html+'<div class="btns"><button class="btn sec" type="button" id="cNo">No</button><button class="btn" type="button" id="cSi">Sí</button></div>';c.hidden=false;
  $('cNo').onclick=()=>{c.hidden=true;};$('cSi').onclick=si;const i=c.querySelector('input');(i||$('cSi')).focus();}
async function cambiar(accion,datos,texto,aviso){
  try{D=await api(accion,Object.assign({id:V.id},datos||{}),texto);pintar();const p=D.pedidos.find(x=>x.id===V.id);if(p)abrir(p.id);else cerrarVer();if(aviso)okMsg(aviso);return D;}
  catch(x){vError(x.message);}
}
function cerrarVer(){$('hVer').hidden=true;V=null;}
$('vIn').addEventListener('click',async e=>{
  const v=e.target.closest('[data-ver]');
  if(v&&!e.target.closest('[data-quitar]')){api('consent_cat_foto_ver',{id:v.dataset.ver}).then(r=>{$('vGrande').innerHTML=`<img class="grande" alt="Foto de referencia" src="${r.foto}">`;}).catch(x=>vError(x.message));return;}
  const q=e.target.closest('[data-quitar]');
  if(q){vConf('<b>¿Quitar esta foto?</b>',()=>cambiar('consent_ped_foto',{quitar:q.dataset.quitar},'Quitando…'));return;}
  const b=e.target.closest('[data-acc]');if(!b)return;
  const a=b.dataset.acc;vError('');
  if(a==='cerrar')return cerrarVer();
  if(a==='llego')return cambiar('consent_ped_estado',{estado:'Llegó'},'Guardando…','✓ '+V.id+' ya llegó. Avísale por WhatsApp.');
  if(a==='avisar'){
    // Se abre una pestaña en blanco al tocar (si no, el celular la bloquea) y luego se le pone el WhatsApp
    const w=window.open('','_blank');
    const r=await cambiar('consent_ped_avisar',{},'Preparando el WhatsApp…');
    if(r&&r.link){if(w)w.location.href=r.link;else location.href=r.link;}else if(w)w.close();
    return;
  }
  if(a==='cobrar'){
    try{localStorage.setItem('yp_handoff',JSON.stringify({desde:'pedido',id_pedido:V.id,id_clienta:V.id_clienta,apodo:V.nombre,sku:V.sku,descripcion:V.descripcion,precio:V.precio,anticipo:V.anticipo,forma_anticipo:V.forma_anticipo}));}catch(x){}
    location.href='nota/?desde=pedido';return;
  }
  if(a==='editar'){cerrarVer();return abrirForm(V);}
  if(a==='cancelar')return vConf('<b>¿Cancelar '+esc(V.id)+'?</b><label class="l" for="cMot">¿Por qué?<input id="cMot" maxlength="200" placeholder="Ej. ya no lo quiso"></label>'+(V.anticipo?'<p class="mu">Ojo: dejó '+pesos(V.anticipo)+' de anticipo. Acuerden si se devuelve.</p>':''),
    ()=>{const m=$('cMot').value.trim();if(!m){vError('Escribe por qué se cancela.');return;}cambiar('consent_ped_estado',{estado:'Cancelado',motivo:m},'Cancelando…','Pedido '+V.id+' cancelado.');});
  if(a==='entregado')return vConf('<b>¿Ya se entregó?</b><label class="l" for="cNota">Número de nota (si hubo)<input id="cNota" placeholder="D-0200"></label>',
    ()=>cambiar('consent_ped_estado',{estado:'Entregado',no_nota:$('cNota').value.trim()},'Guardando…','✓ '+V.id+' entregado.'));
  if(a==='reabrir')return cambiar('consent_ped_estado',{estado:V.estado==='Cancelado'?'Pedido':'Avisado'},'Guardando…');
});
$('vIn').addEventListener('change',async e=>{
  if(e.target.id!=='vFoto')return;
  const fotos=YP.fotos($('vFoto'));if(!fotos.length)return;
  try{for(const f of fotos)await cambiar('consent_ped_foto',{foto:await reducir(f)},'Subiendo la foto…');}catch(x){vError(x.message);}
});
$('hVer').addEventListener('click',e=>{if(e.target.id==='hVer')cerrarVer();});

// ── Nuevo / corregir ──
async function abrirForm(p){
  F={id:p?p.id:'',cli:p&&p.id_clienta?{id:p.id_clienta,apodo:p.nombre}:null};
  $('fTit').textContent=p?'Corregir '+p.id:'Nuevo pedido';
  $('fErr').hidden=true;$('cliQ').value='';$('cliRes').innerHTML='';
  $('fNombre').value=p&&!p.id_clienta?p.nombre:'';$('fWa').value=p?p.whatsapp:'';
  $('fDesc').value=p?p.descripcion:'';$('fPrecio').value=p&&p.precio!==''?p.precio:'';$('fNota').value=p?p.no_nota_pedido:'';
  $('fAnt').value=p&&p.anticipo?p.anticipo:'';$('fForma').value=p?p.forma_anticipo:'';$('fNotas').value=p?p.notas:'';
  $('fFotoCaja').hidden=!!p;YP.fotosLimpiar($('fFoto'));
  pintarCli(p&&!p.id_clienta?'manual':'');
  $('hForm').hidden=false;
  if(!CAT){try{CAT=await api('consent_cat_lista',{});}catch(x){CAT={productos:[]};}}
  $('fSku').innerHTML='<option value="">No está en el catálogo / no sé</option>'+CAT.productos.filter(x=>x.activo).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(x=>`<option value="${esc(x.codigo)}">${esc(x.nombre)} · ${esc(x.codigo)} · ${pesos(x.precio)}</option>`).join('');
  $('fSku').value=p?p.sku:'';
}
function pintarCli(modo){
  $('cliElegida').hidden=!F.cli;$('cliTxt').textContent=F.cli?F.cli.apodo+' · '+F.cli.id:'';
  $('cliBuscar').hidden=!!F.cli||modo==='manual';$('cliManual').hidden=!!F.cli||modo!=='manual';
}
let tBus=null;
$('cliQ').addEventListener('input',()=>{clearTimeout(tBus);const q=$('cliQ').value.trim();if(q.length<2){$('cliRes').innerHTML='';return;}
  tBus=setTimeout(async()=>{try{const r=await api('pink_buscar',{q});if($('cliQ').value.trim()!==q)return;
    $('cliRes').innerHTML=(r.resultados||[]).slice(0,6).map(x=>`<button class="res" type="button" data-id="${esc(x.id)}" data-apodo="${esc(x.apodo||x.nombre)}"><span>${esc(x.apodo||'')} · ${esc(x.nombre)}</span><small>${esc(x.id)}</small></button>`).join('')||'<p class="mu">No la encontré. Puedes escribir su nombre abajo.</p>';}
    catch(x){$('cliRes').innerHTML='<p class="err">'+esc(msg(x.message))+'</p>';}},350);});
$('cliRes').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;F.cli={id:b.dataset.id,apodo:b.dataset.apodo};pintarCli('');});
$('cliQuitar').onclick=()=>{F.cli=null;pintarCli('');$('cliQ').focus();};
$('cliSinId').onclick=()=>{pintarCli('manual');$('fNombre').value=$('cliQ').value.trim();$('fNombre').focus();};
$('fSku').addEventListener('change',()=>{const x=(CAT.productos||[]).find(p=>p.codigo===$('fSku').value);if(x){if(!$('fPrecio').value)$('fPrecio').value=x.precio;if(!$('fDesc').value.trim())$('fDesc').value=x.nombre;}});
$('fCancelar').onclick=()=>{$('hForm').hidden=true;};
$('hForm').addEventListener('click',e=>{if(e.target.id==='hForm')$('hForm').hidden=true;});
$('form').addEventListener('submit',async e=>{
  e.preventDefault();const err=m=>{$('fErr').textContent=msg(m);$('fErr').hidden=false;};$('fErr').hidden=true;
  const pedido={id_clienta:F.cli?F.cli.id:'',nombre:F.cli?'':$('fNombre').value.trim(),whatsapp:F.cli?'':$('fWa').value.trim(),descripcion:$('fDesc').value.trim(),
    sku:$('fSku').value,precio:$('fPrecio').value.trim(),anticipo:$('fAnt').value.trim(),forma_anticipo:$('fForma').value,no_nota_pedido:$('fNota').value.trim(),
    lugar:leer('yp_lugar'),notas:$('fNotas').value.trim()};
  if(!pedido.id_clienta&&!pedido.nombre)return err('Busca a la clienta o escribe su nombre.');
  if(!pedido.descripcion){$('fDesc').focus();return err('Escribe qué pidió.');}
  if(Number(pedido.anticipo)>0&&!pedido.forma_anticipo){$('fForma').focus();return err('¿Cómo pagó el anticipo?');}
  const fotos=YP.fotos($('fFoto'));
  try{
    let r=await api('consent_ped_guardar',{id:F.id,pedido},'Guardando el pedido…');
    for(const f of fotos)r=await api('consent_ped_foto',{id:r.guardado,foto:await reducir(f)},'Subiendo la foto…');
    D=r;$('hForm').hidden=true;estado=D.pedidos.find(p=>p.id===r.guardado)?.estado||estado;pintar();
    okMsg((F.id?'Corregido ✓ ':'Pedido anotado ✓ ')+r.guardado);scrollTo(0,0);
  }catch(x){err(x.message);}
});
function reducir(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82));};
  img.onerror=()=>no(new Error('No pude leer la foto'));img.src=u;});}

$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b){estado=b.dataset.e;okMsg('');pintar();}});
$('lista').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){okMsg('');abrir(b.dataset.id);}});
$('bNuevo').onclick=()=>{okMsg('');abrirForm(null);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('hForm').hidden)$('hForm').hidden=true;else if(!$('hVer').hidden)cerrarVer();}});
async function cargar(){
  error('');
  try{D=await api('consent_ped_lista',{});pintar();}
  catch(x){error(x.message);}
  finally{$('cargador').hidden=true;}
}
if(window.YP_SESION)cargar();else document.addEventListener('yp-sesion',()=>cargar(),{once:true});
</script>
