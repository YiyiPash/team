<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="sesion.js" data-pagina="avisos"></script>
<title>Avisos por WhatsApp · Yiyi Pash</title><link rel="icon" type="image/png" sizes="32x32" href="https://yiyipash.com/team/icono-32.png"><link rel="icon" type="image/png" sizes="192x192" href="https://yiyipash.com/team/icono-192.png"><link rel="apple-touch-icon" href="https://yiyipash.com/team/icono-180.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Avisos por WhatsApp (22/11): lo que está en Pendientes_WA, sin abrir la hoja. Misma marca que el Inicio; verde de WhatsApp. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --on-accent:#ffffff; --bad:#c0262d;
  --wa:#1f8a5b; --wa2:#d3f1e2; --ok:#1f7a4d; --warn:#9a5b00; --warn2:#fff1d6; --info:#1d4f91; --info2:#e3f0ff;
  --font:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.logo{height:42px;width:auto;display:block}
h1{font-family:var(--font);font-weight:700;font-size:23px;line-height:1.2;color:#b82a6c;margin:0;letter-spacing:-.2px;text-wrap:balance}
.mu{font-size:13px;color:var(--mu);margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #f3b4b8;border-radius:12px;padding:10px 12px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;font:500 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--wa);background:var(--wa2);color:#11573a;font-weight:700}
.dia{font-size:13px;font-weight:700;color:var(--mu);margin:8px 2px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dia .viejo{color:var(--warn);font-weight:600}
.av{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.av .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.av .quien{font-weight:700;font-size:15.5px;min-width:0}
.av .quien small{display:block;font-weight:500;font-size:12.5px;color:var(--mu)}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:#fde4ef;color:#a3245f}
.pill.t-Manual{background:var(--info2);color:var(--info)}
.pill.t-Cumpleaños{background:#fff0d6;color:#8a5200}
.pill.t-Invitacion,.pill.t-Invitacion_Tutor{background:#efe4fb;color:#6a3ba8}
.pill.t-Seguimiento,.pill.t-Seguimiento_Tatuaje,.pill.t-Recordatorio{background:#e0f4ef;color:#1d6b5c}
.msg{font-size:13px;color:var(--mu);background:#fff7fb;border-radius:10px;padding:8px 10px 0;border-bottom:8px solid transparent;white-space:pre-line;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;line-height:1.45;max-height:calc(4.35em + 16px)}
.msg.abierto{display:block;-webkit-line-clamp:unset;line-clamp:none;max-height:none}
.ver{background:none;border:none;color:var(--accent);font:600 12.5px var(--font);padding:0;cursor:pointer;justify-self:start}
.correo{font-size:13px;background:var(--info2);color:var(--info);border-radius:10px;padding:8px 10px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;border:none;border-radius:999px;padding:11px 12px;font:700 14px var(--font);cursor:pointer;text-align:center;text-decoration:none}
.btn.wa{background:var(--wa);color:#fff}
.btn.wa[aria-disabled="true"]{background:#e8efe9;color:#5d6b62;pointer-events:none}
.btn.ok{background:var(--surface);color:var(--ok);border:1.5px solid var(--ok)}
.btn.ok.listo{background:var(--ok);color:#fff}
.btn.sec{background:var(--surface);color:var(--accent);border:1.5px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.ver:focus-visible,.no:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.no{background:none;border:none;color:var(--mu);font:500 12.5px var(--font);text-decoration:underline;cursor:pointer;justify-self:start;padding:0}
.nof{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.nof label{display:grid;gap:4px;font-size:13px;font-weight:600}
.nof input{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px}
details.env{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}
details.env summary{cursor:pointer;font-weight:700;color:var(--ok);font-size:14px}
.e{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.e:first-of-type{border-top:none}
.e small{display:block;color:var(--mu);font-size:12.5px}
.e button{flex:none;background:none;border:none;color:var(--accent);font:600 12.5px var(--font);cursor:pointer;text-decoration:underline}
.vacio{background:var(--surface);border:1.5px solid var(--wa2);border-radius:16px;padding:18px;text-align:center;color:var(--ok);font-weight:600}
.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
#cargador{position:fixed;inset:0;z-index:50;background:rgba(255,225,238,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--accent);text-align:center;padding:24px}
@media (max-width:380px){.acc{grid-template-columns:1fr}}
</style>
</head>

  <a class="yp-casita" href="./">⌂ Inicio</a>
  <h1>Avisos por WhatsApp</h1>
  <p class="mu">Toca <b>Abrir WhatsApp</b>, manda el mensaje y al regresar toca <b>Ya lo envié</b>. Queda anotado quién lo mandó y cuándo.</p>
  <p class="err" id="err" hidden></p>
  <div class="filtros" id="filtros" aria-label="Filtrar por tipo de aviso"></div>
  <div id="lista" class="app" style="gap:10px" aria-live="polite"></div>
  <details class="env" id="env" hidden><summary id="envTit">Enviados</summary><div id="envLista"></div></details>
</div>
<div id="cargador" role="status" aria-live="polite"><div class="giro" aria-hidden="true"></div><p id="cargador-txt">Cargando avisos…</p></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwJhAO5anQhZ_tzZ7f6jSE133AxFzSLU2rXkVH1vdtH9SlkMlbnvdjbez3786HIEhAf/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
async function api(action,data,texto){
  if(texto){$('cargador-txt').textContent=texto;$('cargador').hidden=false;}
  try{
    const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    return j.data;
  }finally{if(texto)$('cargador').hidden=true;}
}
function error(m){$('err').textContent=m?(/Failed to fetch|NetworkError|Load failed/i.test(m)?'No hay conexión. Revisa el internet e intenta otra vez.':m):'';$('err').hidden=!m;}
const TIPOS={Manual:'Manual de cuidados',Bienvenida:'Bienvenida',Cumpleaños:'Cumpleaños',Invitacion:'Invitación',Invitacion_Tutor:'Invitación (tutor)',
  Seguimiento:'Revisión de 30 días',Seguimiento_Tatuaje:'Revisión de tatuaje',Recordatorio:'Recordatorio',Vencimiento:'Puntos por vencer',Vencimiento_12:'Puntos de un año',
  Confirmar_18:'Cumple 18',Cumple_12:'Cumple 12',Liga:'Link del Pink Club'};
const tipoTxt=t=>TIPOS[t]||String(t).replace(/_/g,' ');
const DIA=864e5,MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaTxt=ms=>{const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();};
const horaTxt=ms=>{const d=new Date(ms);return d.getDate()+' '+MESES[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const telTxt=w=>w&&w.length===10?w.slice(0,2)+' '+w.slice(2,6)+' '+w.slice(6):(w||'sin número');
let D=null,filtro='Todos',abiertos=new Set(),tocados=new Set(),noAbierto=null;

function diaTxt(ms){
  const dif=Math.round((D.hoy-ms)/DIA);
  return dif<=0?'Hoy · '+fechaTxt(ms):dif===1?'Ayer · '+fechaTxt(ms):fechaTxt(ms);
}
function pintar(){
  const P=D.pendientes;
  const tipos=['Todos',...new Set(P.map(a=>a.tipo))];
  if(!tipos.includes(filtro))filtro='Todos';
  $('filtros').innerHTML=P.length?tipos.map(t=>{const n=t==='Todos'?P.length:P.filter(a=>a.tipo===t).length;
    return `<button class="chip" type="button" aria-pressed="${t===filtro}" data-t="${esc(t)}">${esc(t==='Todos'?'Todos':tipoTxt(t))} · ${n}</button>`;}).join(''):'';
  const vis=P.filter(a=>filtro==='Todos'||a.tipo===filtro);
  let html='',dia=null;
  vis.forEach(a=>{
    if(a.creado!==dia){dia=a.creado;const viejo=D.hoy-a.creado>7*DIA;
      html+=`<div class="dia"><span>${esc(a.creado?diaTxt(a.creado):'Sin fecha')}</span>${viejo?'<span class="viejo">Hace más de 7 días</span>':''}</div>`;}
    const k=a.fila,ab=abiertos.has(k),largo=a.mensaje.length>140;
    html+=`<article class="av" data-f="${k}">
      <div class="top"><div class="quien">${esc(a.nombre||'(sin nombre)')} <span class="mu" style="display:inline">(${esc(a.id)})</span><small>WhatsApp ${esc(telTxt(a.wa))}</small></div><span class="pill t-${esc(a.tipo)}">${esc(tipoTxt(a.tipo))}</span></div>
      <div class="msg${ab||!largo?' abierto':''}">${esc(a.mensaje)}</div>
      ${largo?`<button class="ver" type="button" data-ver="${k}">${ab?'Ver menos':'Ver mensaje completo'}</button>`:''}
      ${a.correo?`<div class="correo">✉️ El manual ya le llegó por correo en la nota <b>${esc(a.correo)}</b>. Si lo prefiere por WhatsApp, mándalo igual.</div>`:''}
      <div class="acc">${a.link?`<a class="btn wa" href="${esc(a.link)}" target="_blank" rel="noopener" data-abrir="${k}">Abrir WhatsApp</a>`:'<a class="btn wa" aria-disabled="true">Sin WhatsApp válido</a>'}
        <button class="btn ok${tocados.has(k)?' listo':''}" type="button" data-env="${k}">Ya lo envié</button></div>
      ${noAbierto===k?`<form class="nof" data-nof="${k}"><label for="mot${k}">¿Por qué no se va a enviar?<input id="mot${k}" maxlength="200" placeholder="Ej. ya se lo dijimos en persona" autocomplete="off"></label>
        <div class="acc"><button class="btn sec" type="button" data-nocancel="1">Cancelar</button><button class="btn ok" type="submit">Guardar</button></div></form>`
        :`<button class="no" type="button" data-no="${k}">No se va a enviar</button>`}
    </article>`;
  });
  $('lista').innerHTML=html||'<div class="vacio">Nada por mandar. 💚</div>';
  const E=D.enviados;
  $('env').hidden=!E.length;
  $('envTit').textContent='Enviados en los últimos 2 días · '+E.length;
  $('envLista').innerHTML=E.map(a=>`<div class="e"><span><b>${esc(a.nombre)}</b> · ${esc(tipoTxt(a.tipo))}<small>${esc(/^No enviar:/.test(a.por)?a.por:'✓ '+(a.por||'sin nombre'))} · ${esc(horaTxt(a.enviado))}</small></span>
    <button type="button" data-des="${a.fila}">Deshacer</button></div>`).join('');
  if(noAbierto!==null){const i=$('mot'+noAbierto);if(i)i.focus();}
  contarInicio();
}
function contarInicio(){   // el Inicio enseña la misma cuenta al momento
  try{const g=JSON.parse(leer('yp_inicio_cuentas')||'{}');g.a=D.pendientes.length;localStorage.setItem('yp_inicio_cuentas',JSON.stringify(g));}catch(e){}
}
async function cargar(texto){
  error('');
  try{D=await api('consent_avisos_lista',{},texto);pintar();}
  catch(x){error(x.message);}
  finally{$('cargador').hidden=true;}
}
const buscar=f=>D.pendientes.find(a=>a.fila===f)||D.enviados.find(a=>a.fila===f);
async function marcar(f,accion,motivo){
  const a=buscar(f);if(!a)return;
  error('');
  try{
    await api('consent_aviso_marcar',{fila:a.fila,id:a.id,tipo:a.tipo,accion,motivo},accion==='deshacer'?'Deshaciendo…':'Guardando…');
    tocados.delete(f);noAbierto=null;
    await cargar('');
  }catch(x){error(x.message);scrollTo(0,0);}
}
$('filtros').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){filtro=b.dataset.t;noAbierto=null;pintar();}});
$('lista').addEventListener('click',e=>{
  const b=e.target.closest('[data-ver],[data-abrir],[data-env],[data-no],[data-nocancel]');if(!b)return;
  if(b.dataset.ver){const k=+b.dataset.ver;abiertos.has(k)?abiertos.delete(k):abiertos.add(k);pintar();return;}
  if(b.dataset.abrir){const k=+b.dataset.abrir;tocados.add(k);setTimeout(()=>{const x=document.querySelector(`[data-env="${k}"]`);if(x)x.classList.add('listo');},300);return;}   // deja abrir WhatsApp
  if(b.dataset.env)return marcar(+b.dataset.env,'enviado');
  if(b.dataset.no){noAbierto=+b.dataset.no;pintar();return;}
  if(b.dataset.nocancel){noAbierto=null;pintar();}
});
$('lista').addEventListener('submit',e=>{
  const f=e.target.closest('[data-nof]');if(!f)return;e.preventDefault();
  const k=+f.dataset.nof,m=$('mot'+k).value.trim();
  if(!m){error('Escribe por qué no se va a enviar.');$('mot'+k).focus();return;}
  marcar(k,'no',m);
});
