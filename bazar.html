<title>Bazar: precios rápidos · Yiyi Pash</title><link rel="icon" type="image/png" sizes="32x32" href="https://yiyipash.com/team/icono-32.png"><link rel="icon" type="image/png" sizes="192x192" href="https://yiyipash.com/team/icono-192.png"><link rel="apple-touch-icon" href="https://yiyipash.com/team/icono-180.png">
<meta name="robots" content="noindex">

<style>
/* Bazar: precios rápidos (sesión 3, 22/11): foto + precio de lo que todavía no está en el catálogo. Solo se consulta; un botón lo pasa al catálogo. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --bad:#c0262d; --ok:#1f7a4d;
  --c:#dd6a3a; --c2:#ffe0cf; --c3:#fff4ec;
  --font:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.logo{height:42px;width:auto;display:block}
h1{font-weight:700;font-size:23px;line-height:1.2;color:#b82a6c;margin:0;letter-spacing:-.2px}
h2{margin:0;font-size:19px;color:#8a3712}
.mu{font-size:13px;color:var(--mu);margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #f3b4b8;border-radius:12px;padding:10px 12px}
.ok{color:var(--ok);font-size:13.5px;margin:0;background:#fff;border:1.5px solid #bfe3cf;border-radius:12px;padding:10px 12px;font-weight:600}
input,textarea{width:100%;font:500 15px var(--font);padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
#q{font-size:16px;padding:12px 14px;border-color:var(--c2)}
label.l{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--mu)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:12px 14px;font:700 15px var(--font);cursor:pointer;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--line)}
.btn.naranja{background:var(--c);color:#fff}
.btn.baja{background:#fff;color:var(--bad);border:1.5px solid #f3b4b8}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn:focus-visible,.gal:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.galeria{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gal{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;border:1.5px solid var(--c2);background:var(--c3);display:grid;place-items:center;cursor:pointer;padding:0;font:inherit;color:var(--mu)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .txt{padding:6px;font-size:13px;font-weight:600;text-align:center;overflow-wrap:anywhere}
.gal .precio{position:absolute;left:5px;bottom:5px;background:#fff;color:#8a3712;border-radius:9px;padding:2px 7px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hoja{position:fixed;inset:0;z-index:70;background:rgba(59,31,46,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja .in{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
.grande{width:100%;border-radius:16px;background:var(--c3);min-height:120px;display:grid;place-items:center;color:var(--mu);font-size:13px;overflow:hidden}
.grande img{width:100%;display:block}
.big{font-size:30px;font-weight:700;color:#8a3712;font-variant-numeric:tabular-nums;margin:0}
.conf{border:1.5px solid var(--c2);background:var(--c3);border-radius:14px;padding:12px;display:grid;gap:8px}
.vacio{grid-column:1/-1;background:var(--surface);border:1.5px dashed var(--c2);border-radius:16px;padding:18px;text-align:center;color:var(--mu)}
.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
#cargador{position:fixed;inset:0;z-index:90;background:rgba(255,225,238,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--accent);text-align:center;padding:24px}
@media (max-width:380px){.dos,.btns{grid-template-columns:1fr}}
</style>
</head>

  <a class="yp-casita" href="./">⌂ Inicio</a>
  <h1>Bazar: precios rápidos</h1>
  <p class="mu">Antes del bazar: foto y precio de lo que no está en el catálogo. En el bazar: busca aquí. En la nota se vende como ítem libre.</p>
  <p class="err" id="err" hidden></p>
  <p class="ok" id="okMsg" hidden></p>
  <button class="btn naranja" type="button" id="bNuevo">📷 Foto y precio</button>
  <input id="q" type="search" placeholder="Buscar: collar, aretes, cadena…" autocomplete="off" aria-label="Buscar en precios rápidos">
  <div class="galeria" id="galeria" aria-live="polite"></div>
</div>

<div class="hoja" id="hNuevo" hidden role="dialog" aria-modal="true" aria-labelledby="nTit">
  <form class="in" id="form" novalidate>
    <h2 id="nTit">Foto y precio</h2>
    <div class="l"><span>Foto</span><input id="nFoto" type="file" accept="image/*" aria-label="Foto del producto"></div>
    <div class="dos">
      <label class="l" for="nPrecio">Precio<input id="nPrecio" inputmode="decimal" placeholder="$" autocomplete="off"></label>
      <label class="l" for="nNombre">¿Qué es? (opcional)<input id="nNombre" maxlength="80" placeholder="Collar círculos" autocomplete="off"></label>
    </div>
    <label class="l" for="nNotas">Notas (opcional)<input id="nNotas" maxlength="300" placeholder="Material, proveedor, cuántas hay…" autocomplete="off"></label>
    <p class="err" id="nErr" hidden></p>
    <div class="btns"><button class="btn sec" type="button" id="nCancelar">Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    <button class="btn sec" type="submit" id="nOtra">Guardar y tomar otra</button>
  </form>
</div>
<div class="hoja" id="hVer" hidden role="dialog" aria-modal="true" aria-labelledby="vTit"><div class="in" id="vIn"></div></div>
<div id="cargador" role="status" aria-live="polite"><div class="giro" aria-hidden="true"></div><p id="cargador-txt">Cargando…</p></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwJhAO5anQhZ_tzZ7f6jSE133AxFzSLU2rXkVH1vdtH9SlkMlbnvdjbez3786HIEhAf/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pesos=n=>'$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2});
async function api(action,data,texto){
  if(texto){$('cargador-txt').textContent=texto;$('cargador').hidden=false;}
  try{
    const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    return j.data;
  }finally{if(texto)$('cargador').hidden=true;}
}
const msg=m=>/Failed to fetch|NetworkError|Load failed/i.test(m)?'No hay conexión. Revisa el internet e intenta otra vez.':m;
function error(m){$('err').textContent=m?msg(m):'';$('err').hidden=!m;}
function okMsg(m){$('okMsg').textContent=m||'';$('okMsg').hidden=!m;}
let D=null,minis={},V=null;
try{minis=JSON.parse(sessionStorage.getItem('yp_cat_minis')||'{}');}catch(e){}
try{const c=JSON.parse(leer('yp_cache_bazar')||'null');if(c&&c.rapidos)D=c;}catch(e){}   // sale al momento aunque el internet del bazar esté lento

function pintar(){
  const q=norm($('q').value.trim());
  const L=D.rapidos.filter(x=>!q||norm(x.nombre+' '+x.notas+' '+x.precio).includes(q));
  $('galeria').innerHTML=L.map(x=>{const m=x.foto&&minis[x.foto];
    return `<button class="gal" type="button" data-id="${x.id}" aria-label="${esc((x.nombre||'Sin nombre')+' '+pesos(x.precio))}">${m?`<img alt="" src="${m}">`:`<span class="txt">${esc(x.nombre||(x.foto?'…':'Sin foto'))}</span>`}<span class="precio">${pesos(x.precio)}</span></button>`;}).join('')
    ||`<div class="vacio">${q?'No encontré "'+esc($('q').value.trim())+'". Revisa también en Precios.':'Todavía no hay precios rápidos. Toca 📷 Foto y precio.'}</div>`;
  $('bNuevo').hidden=!D.editar;
  pedirMinis(L.map(x=>x.foto));
}
let pidiendo=false;
async function pedirMinis(ids){
  ids=ids.filter(f=>f&&!(f in minis)).slice(0,30);
  if(!ids.length||pidiendo)return;pidiendo=true;
  try{const r=await api('consent_cat_mini',{ids});Object.assign(minis,r.minis);try{sessionStorage.setItem('yp_cat_minis',JSON.stringify(minis));}catch(e){}pintar();}
  catch(e){ids.forEach(i=>minis[i]='');}finally{pidiendo=false;}
}
function guardarCache(){try{localStorage.setItem('yp_cache_bazar',JSON.stringify({rapidos:D.rapidos,editar:D.editar,catalogo:D.catalogo}));}catch(e){}}

function abrir(id){
  const x=D.rapidos.find(y=>y.id===id);if(!x)return;V=x;
  $('vIn').innerHTML=`<div class="grande" id="vFoto">${x.foto?(minis[x.foto]?`<img alt="" src="${minis[x.foto]}">`:'Cargando foto…'):'Sin foto'}</div>
    <p class="big">${pesos(x.precio)}</p>
    <h2 id="vTit">${esc(x.nombre||'Sin nombre')}</h2>
    <p class="mu">${esc(x.id)} · ${esc(x.fecha.split('-').reverse().join('/'))}${x.por?' · lo anotó '+esc(x.por):''}${x.notas?' · '+esc(x.notas):''}</p>
    ${D.editar?`<form id="vForm" class="dos" novalidate><label class="l" for="vPrecio">Precio<input id="vPrecio" inputmode="decimal" value="${esc(x.precio)}"></label><label class="l" for="vNombre">Nombre<input id="vNombre" maxlength="80" value="${esc(x.nombre)}"></label>
      <label class="l" for="vNotas" style="grid-column:1/-1">Notas<input id="vNotas" maxlength="300" value="${esc(x.notas)}"></label><button class="btn sec" type="submit" style="grid-column:1/-1">Guardar cambios</button></form>`:''}
    <div class="conf" id="vConf" hidden></div>
    <p class="err" id="vErr" hidden></p>
    ${D.catalogo?'<button class="btn naranja" type="button" id="vPasar">➕ Pasar al catálogo</button>':''}
    ${D.editar?'<button class="btn baja" type="button" id="vQuitar">Quitar de precios rápidos</button>':''}
    <button class="btn sec" type="button" id="vCerrar">Cerrar</button>`;
  $('hVer').hidden=false;
  if(x.foto)api('consent_cat_foto_ver',{id:x.foto}).then(r=>{if(V===x)$('vFoto').innerHTML=`<img alt="Foto de ${esc(x.nombre||'producto')}" src="${r.foto}">`;}).catch(()=>{});
}
function vErr(m){const e=$('vErr');e.textContent=m?msg(m):'';e.hidden=!m;}
$('vIn').addEventListener('click',e=>{
  if(e.target.id==='vCerrar'){$('hVer').hidden=true;V=null;return;}
  if(e.target.id==='vPasar'){
    try{sessionStorage.setItem('yp_cat_desde_bazar',JSON.stringify({bzr:V.id,nombre:V.nombre,precio:V.precio,notas:V.notas}));}catch(x){}
    location.href='catalogo.html?desde=bazar';return;
  }
  if(e.target.id==='vQuitar'){
    const c=$('vConf');c.innerHTML='<b>¿Quitar de precios rápidos?</b><p class="mu">Ya no sale aquí ni en Precios. No se borra.</p><div class="btns"><button class="btn sec" type="button" id="cNo">No</button><button class="btn baja" type="button" id="cSi">Sí, quitar</button></div>';c.hidden=false;
    $('cNo').onclick=()=>{c.hidden=true;};
    $('cSi').onclick=async()=>{try{D=await api('consent_bz_estado',{id:V.id,estado:'Quitado'},'Quitando…');guardarCache();$('hVer').hidden=true;pintar();okMsg('Quitado ✓ '+V.id);}catch(x){vErr(x.message);}};
  }
});
$('vIn').addEventListener('submit',async e=>{
  e.preventDefault();vErr('');
  try{D=await api('consent_bz_guardar',{id:V.id,rapido:{precio:$('vPrecio').value,nombre:$('vNombre').value,notas:$('vNotas').value}},'Guardando…');guardarCache();pintar();abrir(V.id);okMsg('Guardado ✓ '+V.id);}
  catch(x){vErr(x.message);}
});
$('hVer').addEventListener('click',e=>{if(e.target.id==='hVer'){$('hVer').hidden=true;V=null;}});

// Nuevo: foto → precio → (nombre) → Guardar. "Guardar y tomar otra" deja la hoja abierta para seguir.
let otra=false;
$('nOtra').addEventListener('click',()=>{otra=true;});
$('bNuevo').onclick=()=>{okMsg('');abrirNuevo();};
function abrirNuevo(){YP.fotosLimpiar($('nFoto'));['nPrecio','nNombre','nNotas'].forEach(i=>$(i).value='');$('nErr').hidden=true;$('hNuevo').hidden=false;}
$('nCancelar').onclick=()=>{$('hNuevo').hidden=true;};
$('form').addEventListener('submit',async e=>{
  e.preventDefault();const seguir=otra;otra=false;
  const err=m=>{$('nErr').textContent=msg(m);$('nErr').hidden=false;};$('nErr').hidden=true;
  const fotos=YP.fotos($('nFoto')),precio=$('nPrecio').value.trim(),nombre=$('nNombre').value.trim();
  if(!precio){$('nPrecio').focus();return err('Escribe el precio.');}
  if(!fotos.length&&!nombre)return err('Toma la foto o escribe qué es.');
  try{
    D=await api('consent_bz_guardar',{rapido:{foto:fotos.length?await reducir(fotos[fotos.length-1]):'',precio,nombre,notas:$('nNotas').value.trim()}},'Guardando…');
    guardarCache();pintar();okMsg('Guardado ✓ '+D.guardado+' · '+pesos(precio));
    if(seguir)abrirNuevo();else $('hNuevo').hidden=true;
  }catch(x){err(x.message);}
});
function reducir(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8));};
  img.onerror=()=>no(new Error('No pude leer la foto'));img.src=u;});}

$('q').addEventListener('input',()=>{if(D)pintar();});
$('galeria').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){okMsg('');abrir(b.dataset.id);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('hNuevo').hidden=true;$('hVer').hidden=true;V=null;}});
async function cargar(){
  error('');
  if(D){$('cargador').hidden=true;pintar();}
  try{D=await api('consent_bz_lista',{});guardarCache();pintar();}
  catch(x){error(x.message);}
  finally{$('cargador').hidden=true;}
}
if(window.YP_SESION)cargar();else document.addEventListener('yp-sesion',()=>cargar(),{once:true});
</script>
</body>
</html>
